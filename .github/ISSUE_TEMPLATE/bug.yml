name: Bug report
description: Report a reproducible problem with herdrorb.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Use Settings → Copy diagnostics. Do not include prompts, SSH keys, private paths, or confidential screenshots.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include agent CLI versions and whether this affects local or remote sessions.
