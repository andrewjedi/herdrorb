name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Select Swift 6 on macOS 14
        if: matrix.runner == 'macos-14'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Check tag matches source version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - run: swift test
      - run: sh scripts/check.sh
      - run: sh scripts/package-release.sh
      - run: sh scripts/verify-bundle.sh dist/herdrorb.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herdrorb-${{ matrix.runner }}
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified archives and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" --dir artifacts
          cat > release-notes.md <<'NOTES'
          Independent macOS companion for Herdr. Requires macOS 14+ and Herdr 0.9.1 / protocol 22.

          These developer-beta archives are ad-hoc signed and are NOT Developer ID signed or notarized. Gatekeeper may block downloaded builds. Building from source is recommended until a notarized release is available.

          Choose arm64 for Apple Silicon or x86_64 for Intel. Agent CLIs must already be installed and authenticated on each target Mac. See README, CHANGELOG, and docs/COMPATIBILITY.md for setup and current validation limits.
          NOTES
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --draft --prerelease --title "herdrorb $TAG" --notes-file release-notes.md artifacts/*/*.zip artifacts/*/*.sha256
