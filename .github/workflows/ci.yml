name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Interaction and regression checks
        run: sh scripts/check.sh
      - name: Build application
        run: sh build-app.sh
      - name: Check bundle and signature
        run: sh scripts/verify-bundle.sh dist/herdrorb.app
