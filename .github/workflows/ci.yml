name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Swift 6 on macOS 14
        if: matrix.runner == 'macos-14'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Interaction and regression checks
        run: sh scripts/check.sh
      - name: Build application
        run: sh build-app.sh
      - name: Check bundle and signature
        run: sh scripts/verify-bundle.sh dist/herdrorb.app
